{% extends "base.html" %}
{% block title %}Register{% endblock %}
{% block content %}
<div class="auth-wrap">
  <div class="card auth-card">
    <span class="brand-mark">P</span>
    <h1 class="h4 mb-1">Create your account</h1>
    <p class="text-muted small mb-4">Your username is how teammates @mention you.</p>
    <form method="post" novalidate>
      {% csrf_token %}
      {% include "partials/form_fields.html" %}
      <button class="btn btn-primary w-100" type="submit">Register</button>
    </form>
    <p class="mt-4 mb-0 small text-center text-muted">Already registered? <a href="{% url 'login' %}">Log in</a></p>
  </div>
</div>
{% endblock %}
