[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["venv", "*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "S"]
ignore = [
    "S101",  # assert is fine in tests
    "S106",  # hard-coded test passwords in tests are fine
]

[tool.ruff.lint.per-file-ignores]
"**/tests/*" = ["S105", "S311"]
"core/testing.py" = ["S105"]

[tool.ruff.format]
quote-style = "double"
